[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt7274"
version = "1.0.0"
description = "BT-7274 Local AI Assistant — A fully local AI assistant based on BT-7274 from Titanfall 2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Roamer"}
]
dependencies = [
    "numpy>=1.24.0,<2",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "webrtcvad>=2.0.10",
    "noisereduce>=3.0.0",
    "openai-whisper>=20231117",
    "TTS>=0.22.0",
    "torchcodec>=0.11.0",
    "transformers==4.40.2",
    "tokenizers==0.19.1",
    "huggingface-hub==0.23.4",
    "ollama>=0.1.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "scikit-learn>=1.3.0",
    "cryptography>=41.0.0",
    "Pillow>=10.0",
    "opencv-python>=4.8.0,<4.10.0",
    "ultralytics>=8.0.0",
    "face-recognition>=1.3.0",
    "dlib>=19.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bt7274 = "bt7274.cli:main"

[tool.setuptools.packages.find]
include = ["bt7274*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
bt7274_assistant = ["config.yaml", "standby/**/*.wav", "mappings/**/*.json"]
