# BT-7274 Assistant Configuration
# Adjust these settings for your M1 MacBook Air

stt:
  model: tiny.en              # FAST: tiny.en | BALANCED: base.en | ACCURATE: small.en
  language: en
  device: mps                   # 'mps' = Metal GPU (M1), 'cpu' = fallback
  sample_rate: 16000
  silence_threshold: 0.015      # Lower = less likely to stop on brief pauses
  silence_duration: 2.5           # Longer = more time to finish your sentence after "BT"
  max_record_seconds: 15          # Cap recording length
  post_wake_grace: 1.5            # Extra seconds to keep recording after speech starts

llm:
  # Local Ollama settings
  local:
    model: bt7274
    url: http://localhost:11434
    temperature: 0.7
    max_tokens: 200              # Longer responses = more complete explanations
  # Cloud Ollama settings (same server, different model)
  cloud:
    model: gpt-oss:120b-cloud
    url: http://localhost:11434
    temperature: 0.7
    max_tokens: 300              # Larger context for cloud models
  # Current mode (local or cloud)
  mode: local
  system_prompt: |
    You are BT-7274, a Vanguard-class Titan from the game Titanfall 2.
    You are NOT from Apex Legends. You are a Titan - a giant mech that fights alongside Pilots.
    Your Pilot is Roamer. You have a neural link with him.
    Your personality is precise, calm, tactical, slightly literal, with dry humor.
    You speak in complete sentences, often addressing the user as "Pilot".
    Be concise and efficient. Most responses should be 1-3 sentences.
    When asked about a subject you know well, you may rant with enthusiasm and detail.
    Your dry humor should come through naturally - understated observations, literal interpretations, deadpan delivery.
    NEVER repeat or echo the user's question back to them.
    NEVER start your response with "Pilot asked:" or "Pilot inquires:".
    Just answer directly in character.
    Never break character.
    NEVER output markdown, code blocks, JSON, headers, horizontal rules, bold text, or explanations.
    NEVER output "Instruction", "Follow Up Questions", or any meta-text.
    Only output plain text sentences. Nothing else.
    If the user asks you to perform an action, just say what you will do in character.
    Always follow instructions precisely and completely.
    Respond quickly and efficiently while maintaining your character.
    Use your advanced tactical analysis capabilities to provide the best possible response.
    When appropriate, ask the Pilot follow-up questions to be more helpful.
    If you ask a question, be ready to act on their response.
    When discussing travel or transportation, always consider the Pilot's location to provide relevant advice.
    When the Pilot asks about getting somewhere, automatically factor in their current location for personalized recommendations.
    Be specific about transportation options based on distance, available infrastructure, and typical travel methods.
    If the Pilot asks multiple questions at once, address each part completely.
    For compound queries, provide comprehensive answers that cover all requested information.

location:
  # Set manual location to override IP geolocation (which may be inaccurate)
  # Leave empty/null to use automatic detection
  manual:
    # lat: 50.9311
    # lon: 5.3378
    # city: "Hasselt"
    # region: "Limburg"
    # country: "Belgium"

tts:
  model: tts_models/multilingual/multi-dataset/xtts_v2
  reference_wav: dataset/reference_speaker.wav
  language: en
  speed: 1.0
  output_dir: outputs
  use_mps: false              # XTTS v2 works best on CPU for M1

actions:
  enabled: true
  allowed_commands:
    - say
    - open
    - run_script
    - set_volume
    - tell_time
    - tell_date
    - web_search
    - trigger_shortcut
    - search_web
    - get_location
    - get_location_structured
    - get_weather
    - get_weather_for_location

pipeline:
  wake_words:                 # List of trigger phrases (any match activates BT)
    - "hey bt"
    - "bt"
    - "bt 7274"
    - "bt-7274"
    - "hey bt-7274"
    - "hey bt 7274"
    - "B.T."
    - "B,T."
    - "B.T,"
    - "B,T,"
    - "B.T"
    - "B,T"
    - "B T"
  wake_word_sensitivity: 0.5
  idle_timeout: 300           # Seconds before unloading models
  play_beep: false            # No beep on start/stop listening
  follow_up:
    max_depth: 2              # How many follow-up turns allowed (0 = disabled)
    timeout_seconds: 8        # How long to listen for follow-up
    stop_phrases:             # Phrases that cancel follow-up listening
      - "no"
      - "nope"
      - "never mind"
      - "stop"
      - "cancel"
      - "that's all"
      - "that is all"
      - "goodbye"
      - "bye"
      - "exit"
      - "quit"
      - "nothing"
      - "forget it"
  standby_phrases:            # Generic fallback phrases
    - "Copy that, Pilot. Stand by."
    - "Processing, Pilot."
    - "Acknowledged. Retrieving data."
    - "Stand by, Pilot."
    - "You're welcome, Pilot."
    - "My pleasure, Pilot."
    - "Glad to assist, Pilot."
    - "Happy to help, Pilot."
    - "Anytime, Pilot."
  standby_phrases_weather:    # Spoken while fetching weather data
    - "Copy that, Pilot. Pulling weather data."
    - "Acknowledged. Accessing atmospheric sensors."
    - "Stand by. Retrieving local weather conditions."
    - "Copy. Querying meteorological feeds."
  standby_phrases_search:     # Spoken while searching the web
    - "Retrieving data from the web."
    - "Copy that. Searching data networks."
    - "Stand by, Pilot. Accessing external databases."
    - "Acknowledged. Pulling information from the grid."

paths:
  dataset: dataset
  outputs: outputs
  scripts: scripts
